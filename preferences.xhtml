<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul">
  <groupbox>
    <caption label="Language settings / Impostazioni lingua" />
    <vbox>
      <label class="description" value="Automatic follows Zotero's language, with English as fallback. / Automatico segue la lingua di Zotero; inglese come ripiego." />
      <hbox align="center">
        <label class="language-label" value="Language / Lingua" />
        <menulist flex="1" native="true" preference="extensions.zotero.zotpush.language">
          <menupopup>
            <menuitem value="auto" label="Automatic / Automatico" />
            <menuitem value="en" label="English" />
            <menuitem value="it" label="Italiano" />
          </menupopup>
        </menulist>
      </hbox>
    </vbox>
  </groupbox>
</vbox>
